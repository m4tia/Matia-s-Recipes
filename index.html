<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECIPES</title>
<style>

  :root{
    --paper: #F2EDE1;
    --paper-card: #FBF8F1;
    --ink: #2C2A22;
    --ink-soft: #6B6555;
    --line: #D9D0BB;
    --rust: #A8461F;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    padding-bottom:4rem;
  }

  header{
    max-width:700px;
    margin:0 auto;
    padding:3rem 1.5rem 1.5rem;
    text-align:center;
  }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#000000;
    font-weight:700;
    margin:0 0 0.0rem;
  }

  h1{
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight:700;
    -webkit-text-stroke: 2px #BE312E;
    font-size:clamp(2.4rem, 6vw, 3.4rem);
    margin:0 0 0.5rem;
    letter-spacing:-0.01em;
    color:#BE312E;
  }

  .sub{
    color:var(--ink-soft);
    font-size:15px;
    max-width:420px;
    margin:0 auto;
    line-height:1.5;
  }

  .drawer{
    max-width:700px;
    margin:0 auto 1rem;
    padding:0 1.5rem;
  }

  .drawer-label{
    background:var(--ink);
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 16px;
    border-radius:6px;
  }

  .drawer-label svg{ flex-shrink:0; opacity:0.85; color:var(--paper); }

  .drawer-label input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--paper);
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size:15px;
  }

  .drawer-label input::placeholder{ color:rgba(242,237,225,0.55); }

  .section-nav{
    max-width:700px;
    margin:0 auto 1.5rem;
    padding:0 1.5rem;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }

  .chip{
    font-size:12.5px;
    font-weight:700;
    padding:6px 13px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper-card);
    color:var(--ink-soft);
    cursor:pointer;
  }

  .chip:hover{ border-color:var(--ink-soft); color:var(--ink); }

  .chip.active{
    background:var(--rust);
    border-color:var(--rust);
    color:#FBF8F1;
  }

  .section-label{
    max-width:700px;
    margin:0 auto;
    padding:0 1.5rem;
    font-size:12px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
  }

  .list{
    max-width:700px;
    margin:0 auto;
    padding:0 1.5rem;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:6px;
    padding:16px 18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }

  .card:hover{ transform:translateY(-1px); box-shadow:0 4px 12px rgba(44,42,34,0.08); }

  .card h3{
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight:700;
    font-size:18px;
    margin:0;
  }

  .card-section{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    white-space:nowrap;
  }

  .empty{
    max-width:700px;
    margin:2rem auto;
    padding:0 1.5rem;
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
  }

  .overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(44,42,34,0.45);
    align-items:flex-start;
    justify-content:center;
    padding:4vh 1.5rem;
    overflow-y:auto;
    z-index:10;
  }

  .overlay.open{ display:flex; }

  .modal{
    background:var(--paper-card);
    max-width:560px;
    width:100%;
    border-radius:6px;
    padding:2rem 2rem 2.2rem;
    position:relative;
  }

  .modal-close{
    position:absolute;
    top:14px;
    right:14px;
    background:none;
    border:none;
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
    padding:6px 10px;
  }

  .modal-close:hover{ color:var(--ink); }

  .modal-section{
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--rust);
    margin:0 0 8px;
  }

  .modal h2{
    font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight:700;
    font-size:26px;
    margin:0 0 20px;
    padding-right:2rem;
  }

  .modal h4{
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--rust);
    margin:22px 0 8px;
  }

  .modal ul{ margin:0; padding-left:1.15rem; }
  .modal li{ margin-bottom:6px; line-height:1.5; font-size:14.5px; }
  .modal ol{ margin:0; padding-left:1.2rem; }
  .modal ol li{ margin-bottom:10px; line-height:1.55; font-size:14.5px; }
  .modal .note{ font-size:13px; color:var(--ink-soft); margin-top:16px; line-height:1.5; }

  @media (max-width:480px){
    .modal{ padding:1.5rem 1.4rem 1.8rem; }
  }
</style>
</head>

  // ---- RECENTLY USED TRACKING ----
  const RECENT_KEY = "recipe-box-recent";

  function getRecentIds(){
    try{
      const raw = localStorage.getItem(RECENT_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }

  function markUsed(id){
    try{
      let ids = getRecentIds().filter(x => x !== id);
      ids.unshift(id);
      ids = ids.slice(0, 10);
      localStorage.setItem(RECENT_KEY, JSON.stringify(ids));
    }catch(e){
      // storage unavailable — recently used just won't persist
    }
  }

  function getRecentRecipes(){
    const ids = getRecentIds();
    const found = ids
      .map(id => recipes.find(r => r.id === id))
      .filter(Boolean);
    if(found.length < 3){
      recipes.forEach(r => {
        if(found.length >= 3) return;
        if(!found.includes(r)) found.push(r);
      });
    }
    return found.slice(0, 3);
  }

  let query = "";
  let activeSection = null;

  const sections = [...new Set(recipes.map(r => r.section))];
  const nav = document.getElementById('sectionNav');
  sections.forEach(sec => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = sec;
    btn.onclick = () => {
      activeSection = activeSection === sec ? null : sec;
      query = "";
      document.getElementById('search').value = "";
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      if(activeSection) btn.classList.add('active');
      render();
    };
    nav.appendChild(btn);
  });

  function matches(r){
    const q = query.trim().toLowerCase();
    if(!q) return true;
    const haystack = [r.title, r.section, ...r.ingredients].join(' ').toLowerCase();
    return haystack.includes(q);
  }

  function render(){
    const list = document.getElementById('list');
    const empty = document.getElementById('emptyMsg');
    const label = document.getElementById('listLabel');
    list.innerHTML = '';

    const isSearching = query.trim().length > 0;
    let toShow;

    if(isSearching){
      toShow = recipes.filter(matches);
      label.textContent = 'Results';
    }else if(activeSection){
      toShow = recipes.filter(r => r.section === activeSection).sort((a,b) => a.title.localeCompare(b.title));
      label.textContent = activeSection;
    }else{
      toShow = getRecentRecipes();
      label.textContent = 'Recently used';
    }

    empty.style.display = toShow.length ? 'none' : 'block';

    toShow.forEach(r => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<h3>${r.title}</h3><span class="card-section">${r.section}</span>`;
      card.onclick = () => openModal(r.id);
      list.appendChild(card);
    });
  }

  function openModal(id){
    const r = recipes.find(x => x.id === id);
    if(!r) return;
    markUsed(id);
    const modal = document.getElementById('modal');
    modal.innerHTML = `
      <button class="modal-close" onclick="closeModal()">Close ✕</button>
      <p class="modal-section">${r.section}</p>
      <h2>${r.title}</h2>
      <h4>Ingredients</h4>
      <ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>
      ${r.steps.length ? `<h4>Method</h4><ol>${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>` : ''}
      ${r.note ? `<p class="note">${r.note}</p>` : ''}
    `;
    document.getElementById('overlay').classList.add('open');
  }

  function closeModal(){
    document.getElementById('overlay').classList.remove('open');
    render();
  }

  document.getElementById('overlay').addEventListener('click', (e) => {
    if(e.target.id === 'overlay') closeModal();
  });

  document.getElementById('search').addEventListener('input', (e) => {
    query = e.target.value;
    if(query.trim()){
      activeSection = null;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    }
    render();
  });

  render();
</script>
